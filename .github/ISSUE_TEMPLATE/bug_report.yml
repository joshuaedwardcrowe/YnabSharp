name: Bug report
description: Something in YnabSharp doesn't work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Minimal steps to reproduce, ideally a code snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YnabSharp version
      placeholder: "e.g. 1.1.0"
    validations:
      required: true
